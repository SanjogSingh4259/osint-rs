[package]
name = "osint"
version = "0.1.0"
edition = "2021"
authors = ["Sanjog"]
description = "Rust CLI OSINT recon tool for Kali Linux - wraps whois, dig, and recon-ng"

[[bin]]
name = "osint"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "=1.0.86"
colored = "=2.0.4"
chrono = "=0.4.31"

[profile.release]
opt-level = 3
lto = true
